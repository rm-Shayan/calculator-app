<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet"/>
 <link rel="shortcut icon" href="assets/images/1486564177-finance-finance-calculator_81497.png" type="image/x-icon">
  <title>Advanced Calculator</title>
</head>
<body class="flex items-center justify-center h-screen bg-gradient-to-br from-gray-100 to-gray-300">
  <div class="bg-white rounded-2xl shadow-2xl p-6 w-[420px] relative">
    <!-- Display and History Toggle -->
    <div class="flex items-center justify-between mb-4">
      <input type="text" id="display" class="flex-grow h-16 text-right text-3xl bg-gray-100 text-gray-800 border border-gray-300 rounded-lg px-4" disabled>
      <button id="toggleHistory" class="ml-2 bg-purple-600 text-white px-3 py-2 rounded-lg hover:bg-purple-700 transition">History</button>
    </div>

    <!-- Buttons Grid -->
    <div class="grid grid-cols-4 gap-4" id="cal-container">
      <button value="C" class="bg-red-500 text-white rounded-lg h-16 hover:bg-red-400">C</button>
      <button value="DEL" class="bg-yellow-500 text-white rounded-lg h-16 hover:bg-yellow-400">⌫</button>
      <button value="/" class="bg-gradient-to-br from-orange-500 to-orange-600 text-white rounded-lg h-16 hover:opacity-80">÷</button>
      <button value="*" class="bg-gradient-to-br from-orange-500 to-orange-600 text-white rounded-lg h-16 hover:opacity-80">×</button>

      <button value="7" class="bg-gray-200 text-black rounded-lg h-16 hover:bg-gray-300">7</button>
      <button value="8" class="bg-gray-200 text-black rounded-lg h-16 hover:bg-gray-300">8</button>
      <button value="9" class="bg-gray-200 text-black rounded-lg h-16 hover:bg-gray-300">9</button>
      <button value="-" class="bg-gradient-to-br from-orange-500 to-orange-600 text-white rounded-lg h-16 hover:opacity-80">−</button>

      <button value="4" class="bg-gray-200 text-black rounded-lg h-16 hover:bg-gray-300">4</button>
      <button value="5" class="bg-gray-200 text-black rounded-lg h-16 hover:bg-gray-300">5</button>
      <button value="6" class="bg-gray-200 text-black rounded-lg h-16 hover:bg-gray-300">6</button>
      <button value="+" class="bg-gradient-to-br from-orange-500 to-orange-600 text-white rounded-lg h-16 hover:opacity-80">+</button>

      <button value="1" class="bg-gray-200 text-black rounded-lg h-16 hover:bg-gray-300">1</button>
      <button value="2" class="bg-gray-200 text-black rounded-lg h-16 hover:bg-gray-300">2</button>
      <button value="3" class="bg-gray-200 text-black rounded-lg h-16 hover:bg-gray-300">3</button>
      <button value="=" class="bg-green-600 text-white rounded-lg h-16 hover:bg-green-500">=</button>

      <button value="0" class="col-span-2 bg-gray-200 text-black rounded-lg h-16 hover:bg-gray-300">0</button>
      <button value="." class="bg-gray-200 text-black rounded-lg h-16 hover:bg-gray-300">.</button>
    </div>
  </div>

  <!-- History Panel -->
  <div id="historyPanel" class="bg-white rounded-xl shadow-lg p-4 w-64 absolute right-10 top-10 max-h-96 overflow-y-auto hidden z-50">
    <h2 class="text-xl font-semibold mb-3">History</h2>
    <div id="history" class="text-sm space-y-2"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
